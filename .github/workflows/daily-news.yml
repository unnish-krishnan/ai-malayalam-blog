name: Daily Malayalam News Agent

on:
  schedule:
    # 6:00 AM GST = 2:00 AM UTC
    - cron: '0 2 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run News Agent
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          AGENT_SECRET:        ${{ secrets.AGENT_SECRET }}
          SITE_URL:            https://ai-malayalam.com
          ARTICLES_PER_DAY:    "5"
          PUBLISH_MODE:        "git"
        run: python agent/news_agent.py

      - name: Commit and push new articles
        run: |
          git config user.name "AI Malayalam Bot"
          git config user.email "bot@ai-malayalam.com"
          git add content/
          git diff --staged --quiet || git commit -m "chore: add daily news articles $(date -u '+%Y-%m-%d')"
          git push

      - name: Report result
        if: always()
        run: echo "Agent completed at $(date -u)"
